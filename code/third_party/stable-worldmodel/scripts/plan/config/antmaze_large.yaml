# OGBench AntMaze-Large from pixels at 224 px (quadruped; camera follows the robot, coloured floor, as in OGBench visual-antmaze).
# Data: antmaze-large-navigate-v0 re-rendered by code/lewm_explorations/paa/antmaze_data.py. Checkpoint: our own LeWM (exp-30).
defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  env_name: swm/AntMaze-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set in eval_wm.py to 2 * eval_budget
  task: large
  resolution: 224

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: antmaze_large.h5
  callables:
    - method: set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state
    - method: _set_goal_proprio
      args:
        goal_proprio:
          value: goal_proprio

output:
  filename: antmaze_large_results.txt
