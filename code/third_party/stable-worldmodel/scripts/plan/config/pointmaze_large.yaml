# OGBench PointMaze-Large rendered at 224 px (LeWAM, arXiv 2610.12818; env and callables from MinghaoFu/lewam
# configs/eval/pointmaze.yaml). Checkpoint: our own LeWM trained on LeWAM/lewam-pointmaze-large.
defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  env_name: swm/PointMaze-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set in eval_wm.py to 2 * eval_budget
  task: large
  resolution: 224

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pointmaze_large.h5
  callables:
    - method: set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state
    - method: _set_goal_proprio
      args:
        goal_proprio:
          value: goal_proprio

output:
  filename: pointmaze_large_results.txt
